package: cloud.lazycat.app.affine
# Online-store baseline. The executor allocates the selected stable upstream
# version on the first real run; do not fabricate a publication state lock.
version: 0.27.5
name: AFFiNE
description: 本地优先的文档、白板与知识协作平台
author: toeverything
license: https://github.com/toeverything/AFFiNE/blob/v0.27.4/LICENSE
homepage: https://affine.pro
# tar-format LPK v2 requires lzcos 1.5.0+ (OIDC itself starts at 1.3.5).
min_os_version: 1.5.0
locales:
  zh-CN:
    name: AFFiNE
    description: 本地优先的文档、白板与知识协作平台
    usage: |
      本版采用全新数据目录，不迁移旧版 0.25.7 的数据；
      首次打开应用后按向导创建管理员，后续可使用懒猫账号登录；
      文档、附件、配置及数据库持久保存在 /lzcapp/var/affine；
      AI、邮件服务需要另行配置，全文搜索索引服务未启用。
  en-US:
    name: AFFiNE
    description: A local-first platform for documents, whiteboards and knowledge collaboration
    usage: |
      This release uses a new data directory and does not migrate version 0.25.7 data;
      Create an administrator in the initial setup, then sign in with your LazyCat account;
      Documents, attachments, configuration and databases persist under /lzcapp/var/affine;
      AI and email require separate configuration. The full-text indexer is disabled.
permissions:
  required:
    - net.internet
  optional:
    - net.lan
