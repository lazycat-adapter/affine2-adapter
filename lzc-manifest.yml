usage: |
  本版使用全新数据目录，不迁移旧版 0.25.7 数据；
  首次访问请创建管理员，支持懒猫 OIDC 登录；
  数据持久保存在 /lzcapp/var/affine。
application:
  subdomain: affine2
  multi_instance: false
  oidc_redirect_path: /oauth/callback
  routes:
    - /=http://affine:3010
  public_path:
    - /oauth/callback
  injects:
    - id: lazycat-file-bridge
      on: request
      when:
        - /__lazycat_file_bridge/*
      do:
        - src: |
            const bridgePrefix = "/__lazycat_file_bridge";
            const requestHost = String(ctx.request.host || "")
              .split(":")[0]
              .toLowerCase();
            const firstDot = requestHost.indexOf(".");
            const method = String(ctx.request.method || "").toUpperCase();

            if (
              firstDot <= 0 ||
              !requestHost.endsWith(".heiyu.space") ||
              !["GET", "HEAD", "PUT"].includes(method)
            ) {
              ctx.response.send(
                ["GET", "HEAD", "PUT"].includes(method) ? 400 : 405,
                "Invalid LazyCat file bridge request",
              );
              return;
            }

            const boxDomain = requestHost.slice(firstDot + 1);
            const fileOrigin = "https://file." + boxDomain;
            const targetPath =
              "/files/home" + ctx.request.path.slice(bridgePrefix.length);

            ctx.headers.del("Origin");
            ctx.headers.del("Referer");
            ctx.proxy.to(fileOrigin, {
              path: targetPath,
              query: ctx.request.raw_query,
              use_target_host: true,
              timeout_ms: 120000,
              on_fail: "error",
            });
    - id: open-save-chooser
      on: browser
      when:
        - /*
      do:
        - src: file:///lzcapp/pkg/content/lazycat-injects/lzc-file-chooser-inject.js
          params:
            diskRoot: /_lzc/files/home
            fileBridgeRoot: /__lazycat_file_bridge
            fallbackMime: application/octet-stream
            locale: auto
            hooks:
              fileSystemAccess: true
              fileInput: true
              downloadAnchor: true
  health_check:
    test_url: http://affine:3010/info
    start_period: 300s
services:
  affine:
    # Source placeholders are replaced by the executor before packaging.
    # upstream: ghcr.io/toeverything/affine:0.27.4@sha256:c312116a134184947d98749c8a8e29f4e3bc97f4f2a51c9a3497f9baea2eec2b
    image: registry.lazycat.cloud/peter/toeverything/affine:64ba071dc398e17f
    binds:
      - /lzcapp/var/affine/storage:/root/.affine/storage
      - /lzcapp/var/affine/config:/root/.affine/config
    command: >-
      sh -ec 'node /lzcapp/pkg/content/bootstrap.cjs;
      node ./scripts/self-host-predeploy.js;
      node /lzcapp/pkg/content/refresh-managed.cjs; exec node ./dist/main.js'
    environment:
      REDIS_SERVER_HOST: redis
      DATABASE_URL: postgresql://affine@postgres:5432/affine
      AFFINE_INDEXER_ENABLED: 'false'
      AFFINE_EXTERNAL_URL: 'https://{{ .S.AppDomain }}'
      AFFINE_OIDC_CLIENT_ID: '${LAZYCAT_AUTH_OIDC_CLIENT_ID}'
      AFFINE_OIDC_CLIENT_SECRET: '${LAZYCAT_AUTH_OIDC_CLIENT_SECRET}'
      AFFINE_OIDC_ISSUER: '${LAZYCAT_AUTH_OIDC_ISSUER_URI}'
      TZ: Asia/Shanghai
    depends_on:
      - redis
      - postgres
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3010/info').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 300s
  redis:
    # upstream: docker.io/library/redis:7.4@sha256:a6dd428750118c2c2c67d3f555faef0aa15a2b71198b40e1cb3b9229b1cf3094
    image: registry.lazycat.cloud/peter/library/redis:9cafcd06f51bc9e8
    command: redis-server --appendonly yes
    binds:
      - /lzcapp/var/affine/redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 10
  postgres:
    # upstream: docker.io/pgvector/pgvector:pg16@sha256:018b4a92e634c3a5715f613dd43497e3d8028ae051be7ba6fd127bcffb0e7957
    image: registry.lazycat.cloud/peter/pgvector/pgvector:feca493028d1cb5c
    binds:
      - /lzcapp/var/affine/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: affine
      POSTGRES_DB: affine
      POSTGRES_INITDB_ARGS: --data-checksums
      # Official deployment uses trust on its isolated application network.
      # No database port is published to the host or the public network.
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: [CMD, pg_isready, -U, affine, -d, affine]
      interval: 10s
      timeout: 5s
      retries: 10
