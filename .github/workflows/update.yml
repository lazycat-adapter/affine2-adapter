name: Update AFFiNE for LazyCat
run-name: ${{ (github.event_name == 'push' || inputs.dry-run) && 'AFFiNE → LazyCat [仅检查]' || 'AFFiNE → LazyCat [验证、打包并送审]' }}
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update.yml
      - content/**
      - scripts/**
      - tests/**
      - requirements-test.txt
      - lazycat-action.yml
      - lzc-build.yml
      - lzc-manifest.yml
      - package.yml
      - icon.png
  schedule:
    # UTC; Beijing 02:17 / 08:17 / 14:17 / 20:17. GitHub may delay schedules.
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 勾选＝仅检查；取消勾选＝转存镜像、真实验证、打包并送审。
        type: boolean
        default: true
      verify-image:
        description: 仅检查时也运行全新安装、同步、OIDC 和持久化测试，不送审。
        type: boolean
        default: false
      retry-rejected:
        description: 修复后重试被拒绝的源版本，须同时取消仅检查。
        type: boolean
        default: false
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: affine-lazycat-update
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate deployment and failure guards
        run: |
          python -m pip install --disable-pip-version-check -r requirements-test.txt
          python -B -m unittest discover -s tests -v
          node --test tests/bootstrap.test.cjs
          python - <<'PY'
          import ast,pathlib,sys
          sys.path.insert(0,'scripts')
          from contract import validate
          validate()
          for path in pathlib.Path('scripts').glob('*.py'): ast.parse(path.read_text())
          PY
      - name: Read published upstream metadata with GitHub authentication
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -B - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          from upstream import release
          selected = release()
          print('Authenticated stable release:', selected['tag'], selected['revision'])
          PY
      - name: Verify developer permission before publication
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry-run)
        env:
          LZC_API_TOKEN: ${{ secrets.LZC_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w 0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" push --dry-run origin "HEAD:${GITHUB_REF_NAME}"
          test -n "${LZC_API_TOKEN}" || { echo '::error::Configure LZC_API_TOKEN in Repository secrets.'; exit 1; }
          curl --fail --silent --show-error --retry 2 \
            --header "X-API-Token: ${LZC_API_TOKEN}" \
            --output "${RUNNER_TEMP}/affine-access.json" \
            'https://appstore.api.lazycat.cloud/sdk/v3/developer/app/cloud.lazycat.app.affine2/review/list?page=0&size=1'
          python - "${RUNNER_TEMP}/affine-access.json" <<'PY'
          import json,sys
          result=json.load(open(sys.argv[1]))
          if result.get('errorCode')!=0: raise SystemExit('Developer access denied: '+str(result.get('msg','unknown error')))
          print('Developer access for cloud.lazycat.app.affine2 verified.')
          PY
      - name: Verify upstream images without publication
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run && inputs.verify-image
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -B scripts/verify_latest.py
      - name: Upload isolated verification evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.dry-run && inputs.verify-image
        uses: actions/upload-artifact@v7
        with:
          name: affine-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .lazycat-action/runtime-proof.json
            .lazycat-action/reports/
          if-no-files-found: ignore
  update:
    needs: validate
    uses: wcaqrl/lazycat-action/.github/workflows/lazycat.yml@v1
    with:
      config: lazycat-action.yml
      operation: auto
      runner: ubuntu-24.04
      toolchains: docker
      enable-qemu: false
      dry-run: ${{ github.event_name == 'push' || inputs.dry-run || false }}
      retry-rejected: ${{ github.event_name == 'workflow_dispatch' && inputs.retry-rejected || false }}
    secrets: inherit
